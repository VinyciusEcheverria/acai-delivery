<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Açaí do Delta</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --p:#7c3aed;--pk:#ec4899;--g:linear-gradient(135deg,#7c3aed,#ec4899);
  --bg:#fdf4ff;--card:#fff;--sh:0 4px 24px #0001;
  --txt:#1f2937;--sub:#6b7280;--border:#e5e7eb;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;color:var(--txt);}

/* TOAST */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:0 4px 20px #0003;animation:slideIn .3s ease;max-width:300px;}
.toast.success{background:#d1fae5;color:#065f46;border-left:4px solid #10b981;}
.toast.error{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444;}
.toast.info{background:#dbeafe;color:#1e40af;border-left:4px solid #3b82f6;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* LOADING */
#global-loading{position:fixed;inset:0;background:var(--g);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;}
#global-loading .logo{font-size:4rem;animation:pulse 1.5s infinite;}
#global-loading h1{color:#fff;font-size:1.5rem;margin-top:12px;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.spinner{width:22px;height:22px;border:3px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;}
.spinner-dark{width:18px;height:18px;border:3px solid #7c3aed33;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* AUTH */
#auth-screen{display:none;min-height:100vh;background:var(--g);align-items:center;justify-content:center;padding:20px;}
.auth-box{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 8px 40px #0003;}
.auth-logo{text-align:center;font-size:3rem;margin-bottom:8px;}
.auth-title{text-align:center;font-size:1.6rem;font-weight:800;color:var(--p);margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--sub);font-size:.9rem;margin-bottom:28px;}
.auth-tabs{display:flex;margin-bottom:24px;border-radius:12px;overflow:hidden;border:2px solid var(--border);}
.auth-tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-weight:600;font-size:.9rem;background:#fff;color:var(--sub);transition:.2s;}
.auth-tab.active{background:var(--g);color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block;font-weight:600;font-size:.85rem;color:var(--txt);margin-bottom:6px;}
.field input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:12px;font-size:1rem;outline:none;transition:.2s;}
.field input:focus{border-color:var(--p);}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:var(--g);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.btn-secondary{background:#f3f4f6;color:var(--txt);border:none;}
.btn-danger{background:#ef4444;color:#fff;border:none;}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:10px;border:none;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;}

/* APP */
#app-screen{display:none;}
header{background:var(--g);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px #0002;}
.logo-h{color:#fff;font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.store-badge{background:#fff2;color:#fff;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;margin-left:6px;}
.store-badge.closed{background:#ef4444aa;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.hdr-btn{background:#fff2;border:none;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:.2s;}
.hdr-btn:hover{background:#fff3;}
.cart-badge{background:#fff;color:var(--p);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -4px 20px #0001;}
.nav-item{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--sub);font-size:.7rem;font-weight:600;transition:.2s;}
.nav-item.active{color:var(--p);}
.nav-icon{font-size:1.4rem;}

/* MAIN */
.main{padding:16px 16px 90px;}

/* BANNER */
.banner{background:var(--g);border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.banner-text h2{font-size:1.25rem;font-weight:800;}
.banner-text p{font-size:.85rem;opacity:.85;margin-top:4px;}
.banner-emoji{font-size:3.5rem;}

/* STORE INFO */
.store-info{background:#fff;border-radius:16px;padding:16px;margin-bottom:20px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;}
.store-icon{font-size:2.5rem;}
.store-details h3{font-weight:800;}
.store-details p{color:var(--sub);font-size:.85rem;margin-top:2px;}
.store-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.8rem;font-weight:700;margin-top:6px;}
.store-status.open{background:#d1fae5;color:#065f46;}
.store-status.closed{background:#fee2e2;color:#991b1b;}

/* SECTION */
.sec-title{font-size:1.1rem;font-weight:800;color:var(--txt);margin-bottom:14px;}

/* MENU ITEMS */
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:28px;}
.item-card{background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden;transition:.2s;display:flex;flex-direction:column;}
.item-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px #0002;}
.item-img{width:100%;height:140px;object-fit:cover;background:linear-gradient(135deg,#f3e8ff,#fce7f3);}
.item-img-placeholder{width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:linear-gradient(135deg,#f3e8ff,#fce7f3);}
.item-body{padding:14px;}
.item-name{font-weight:700;font-size:.95rem;margin-bottom:4px;}
.item-desc{color:var(--sub);font-size:.82rem;margin-bottom:10px;line-height:1.4;}
.item-bottom{display:flex;align-items:center;justify-content:space-between;}
.item-price{font-weight:800;color:var(--p);font-size:1.05rem;}
.add-btn{background:var(--g);color:#fff;border:none;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.85rem;transition:.2s;}
.add-btn:hover{opacity:.85;}
.category-label{display:inline-block;background:#f3e8ff;color:var(--p);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;margin-bottom:6px;}

/* CART */
.cart-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
.cart-item-top{display:flex;align-items:flex-start;gap:10px;}
.cart-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:linear-gradient(135deg,#f3e8ff,#fce7f3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.cart-item-info{flex:1;}
.cart-item-name{font-weight:700;font-size:.95rem;}
.cart-item-price{color:var(--p);font-weight:600;font-size:.85rem;margin-top:2px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;}
.qty-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--p);background:#fff;color:var(--p);font-size:1rem;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty-num{font-weight:700;min-width:24px;text-align:center;}
.obs-input{width:100%;margin-top:8px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;outline:none;resize:none;font-family:inherit;}
.obs-input:focus{border-color:var(--p);}

/* CART SUMMARY */
.cart-summary{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--sh);margin-top:12px;}
.summary-row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--sub);margin-bottom:8px;}
.summary-total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;padding-top:10px;border-top:2px solid var(--border);margin-top:4px;}
.pay-section{margin-top:16px;}
.pay-title{font-weight:700;margin-bottom:10px;font-size:.95rem;}
.pay-opts{display:flex;gap:8px;flex-wrap:wrap;}
.pay-opt{padding:10px 16px;border-radius:10px;border:2px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:.9rem;transition:.2s;}
.pay-opt.selected{border-color:var(--p);background:#f5f3ff;color:var(--p);}
.checkout-btn{width:100%;margin-top:16px;padding:15px;background:var(--g);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;transition:.2s;}
.checkout-btn:hover{opacity:.9;}
.empty-state{text-align:center;padding:48px 20px;color:var(--sub);}
.empty-icon{font-size:3rem;margin-bottom:12px;}

/* ADDRESS MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:#0007;z-index:500;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:24px 24px 0 0;padding:28px 24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:1.15rem;font-weight:800;color:var(--p);margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.modal-close{margin-left:auto;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--sub);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-weight:600;font-size:.85rem;}
.form-group input,.form-group select,.form-group textarea{padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-size:.95rem;outline:none;transition:.2s;font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--p);}

/* TIMELINE */
.order-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--sh);}
.order-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-id{font-weight:800;color:var(--p);}
.order-date{color:var(--sub);font-size:.8rem;}
.order-items-list{color:var(--sub);font-size:.85rem;margin-bottom:14px;line-height:1.5;}
.timeline{display:flex;flex-direction:column;}
.tl-step{display:flex;gap:12px;align-items:flex-start;}
.tl-dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--border);background:#fff;flex-shrink:0;margin-top:2px;}
.tl-dot.done{background:var(--p);border-color:var(--p);}
.tl-dot.active{background:#fff;border-color:var(--p);box-shadow:0 0 0 4px #7c3aed22;}
.tl-line{width:3px;height:18px;background:var(--border);margin-left:8px;}
.tl-line.done{background:var(--p);}
.tl-label{font-size:.85rem;font-weight:600;color:var(--sub);padding-bottom:14px;}
.tl-label.done,.tl-label.active{color:var(--txt);}
.order-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap;gap:8px;}
.order-total{font-weight:800;color:var(--p);}
.order-pay{font-size:.8rem;color:var(--sub);}
.repeat-btn{padding:7px 14px;background:#f5f3ff;color:var(--p);border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.82rem;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:700;}
.badge-novo{background:#fef3c7;color:#92400e;}
.badge-aceito{background:#dbeafe;color:#1e40af;}
.badge-preparo{background:#ede9fe;color:#5b21b6;}
.badge-entrega{background:#fce7f3;color:#9d174d;}
.badge-entregue{background:#d1fae5;color:#065f46;}
.badge-cancelado{background:#fee2e2;color:#991b1b;}

/* ADMIN */
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
.dash-card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--sh);text-align:center;}
.dash-val{font-size:1.5rem;font-weight:800;color:var(--p);}
.dash-label{font-size:.78rem;color:var(--sub);margin-top:4px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.filter-btn{padding:7px 16px;border-radius:20px;border:2px solid var(--border);background:#fff;color:var(--sub);cursor:pointer;font-weight:600;font-size:.82rem;white-space:nowrap;transition:.2s;}
.filter-btn.active{background:var(--g);color:#fff;border-color:transparent;}
.admin-order{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--sh);}
.admin-order-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.admin-order-id{font-weight:800;color:var(--p);}
.admin-meta{color:var(--sub);font-size:.82rem;margin-bottom:4px;}
.admin-items-txt{color:var(--txt);font-size:.88rem;margin-bottom:8px;line-height:1.5;}
.admin-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.admin-total{font-weight:800;color:var(--p);}
.status-select{padding:7px 10px;border-radius:8px;border:2px solid var(--border);font-weight:600;cursor:pointer;outline:none;font-size:.82rem;background:#fff;}
.cancel-btn{padding:6px 12px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem;}

/* ADMIN TABS */
.admin-tabs{display:flex;gap:8px;margin-bottom:20px;}
.admin-tab{padding:9px 20px;border-radius:20px;border:2px solid var(--border);background:#fff;color:var(--sub);cursor:pointer;font-weight:700;font-size:.88rem;transition:.2s;}
.admin-tab.active{background:var(--g);color:#fff;border-color:transparent;}

/* PRODUCT MANAGER */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:20px;}
.product-card{background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden;}
.product-img{width:100%;height:120px;object-fit:cover;background:linear-gradient(135deg,#f3e8ff,#fce7f3);}
.product-img-placeholder{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:linear-gradient(135deg,#f3e8ff,#fce7f3);}
.product-body{padding:12px;}
.product-name{font-weight:700;font-size:.92rem;margin-bottom:2px;}
.product-price{color:var(--p);font-weight:800;font-size:.95rem;margin-bottom:8px;}
.product-actions{display:flex;gap:6px;}
.edit-btn{flex:1;padding:7px;background:#f5f3ff;color:var(--p);border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem;}
.del-btn{padding:7px 10px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem;}
.add-product-btn{width:100%;padding:14px;background:var(--g);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;}

/* PRODUCT MODAL */
#product-modal .modal-box{max-width:500px;}
.img-preview-wrap{width:100%;height:160px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#f3e8ff,#fce7f3);display:flex;align-items:center;justify-content:center;margin-bottom:12px;cursor:pointer;border:2px dashed var(--border);position:relative;}
.img-preview-wrap img{width:100%;height:100%;object-fit:cover;}
.img-preview-wrap .overlay{position:absolute;inset:0;background:#0004;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;opacity:0;transition:.2s;}
.img-preview-wrap:hover .overlay{opacity:1;}
.img-placeholder-txt{color:var(--sub);font-size:.9rem;font-weight:600;}

/* PROFILE */
.profile-card{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--sh);margin-bottom:14px;}
.avatar-circle{width:80px;height:80px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 10px;color:#fff;font-weight:800;}

.hidden{display:none!important;}
.mt8{margin-top:8px;}
.mt16{margin-top:16px;}
.mt20{margin-top:20px;}
</style>
</head>
<body>

<div id="global-loading">
  <div class="logo">🍇</div>
  <h1>Açaí do Delta</h1>
</div>

<div id="toast-container"></div>

<!-- AUTH -->
<div id="auth-screen" style="display:flex;">
  <div class="auth-box">
    <div class="auth-logo">🍇</div>
    <div class="auth-title">Açaí do Delta</div>
    <div class="auth-sub">Faça login para fazer seu pedido</div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">Cadastrar</div>
    </div>
    <div id="login-form">
      <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"/></div>
      <div class="field"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Entrar</button>
      <div style="text-align:center;margin-top:12px;">
        <span style="color:var(--p);cursor:pointer;font-size:.85rem;" onclick="doForgotPassword()">Esqueci minha senha</span>
      </div>
    </div>
    <div id="register-form" class="hidden">
      <div class="field"><label>Nome completo</label><input type="text" id="reg-name" placeholder="Seu nome"/></div>
      <div class="field"><label>E-mail</label><input type="email" id="reg-email" placeholder="seu@email.com"/></div>
      <div class="field"><label>Telefone</label><input type="tel" id="reg-phone" placeholder="(67) 99999-9999" oninput="maskPhone(this)"/></div>
      <div class="field"><label>Senha</label><input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"/></div>
      <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">Criar conta</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <div class="logo-h">🍇 Açaí do Delta <span class="store-badge" id="store-badge">⏳</span></div>
    <div class="hdr-right">
      <button class="hdr-btn" onclick="navTo('cart')">🛒 <span class="cart-badge" id="cart-count">0</span></button>
    </div>
  </header>
  <div class="main" id="main-content"></div>
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="navTo('home')"><span class="nav-icon">🏠</span>Início</button>
    <button class="nav-item" id="nav-cart" onclick="navTo('cart')"><span class="nav-icon">🛒</span>Carrinho</button>
    <button class="nav-item" id="nav-orders" onclick="navTo('orders')"><span class="nav-icon">📦</span>Pedidos</button>
    <button class="nav-item" id="nav-profile" onclick="navTo('profile')"><span class="nav-icon">👤</span>Perfil</button>
    <button class="nav-item hidden" id="nav-admin" onclick="navTo('admin')"><span class="nav-icon">⚙️</span>Admin</button>
  </nav>
</div>

<!-- ADDRESS MODAL -->
<div class="modal-overlay" id="addr-modal">
  <div class="modal-box">
    <div class="modal-title">📍 Endereço de entrega <button class="modal-close" onclick="closeAddrModal()">✕</button></div>
    <div class="form-grid">
      <div class="form-group full"><label>Nome completo *</label><input type="text" id="addr-name"/></div>
      <div class="form-group full"><label>Telefone *</label><input type="tel" id="addr-phone" oninput="maskPhone(this)" placeholder="(67) 99999-9999"/></div>
      <div class="form-group full"><label>Rua *</label><input type="text" id="addr-street"/></div>
      <div class="form-group"><label>Número *</label><input type="text" id="addr-num"/></div>
      <div class="form-group"><label>Bairro *</label><input type="text" id="addr-neighborhood"/></div>
      <div class="form-group"><label>Complemento</label><input type="text" id="addr-comp"/></div>
      <div class="form-group"><label>Referência</label><input type="text" id="addr-ref"/></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem;font-weight:600;margin-top:14px;">
      <input type="checkbox" id="save-addr-check" checked> Salvar endereço no perfil
    </label>
    <button class="btn btn-primary mt16" onclick="confirmAddress()">Confirmar endereço</button>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box">
    <div class="modal-title" id="product-modal-title">➕ Novo Produto <button class="modal-close" onclick="closeProductModal()">✕</button></div>
    <div class="img-preview-wrap" onclick="document.getElementById('product-img-input').click()">
      <img id="product-img-preview" src="" style="display:none;"/>

      <div class="overlay">Trocar foto</div>

        <select id="prod-category">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection,
  addDoc, query, where, orderBy, onSnapshot, serverTimestamp, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPNDXI9Ii0-3Xa4F5YRqHgcCAwcaErjAQ",
  authDomain: "acai-do-delta.firebaseapp.com",
  projectId: "acai-do-delta",
  storageBucket: "acai-do-delta.firebasestorage.app",
  messagingSenderId: "593981403306",
  appId: "1:593981403306:web:6c58398a78c8ccac17a0d3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_EMAIL = "vinycius.fernandes.ms@gmail.com";
const DELIVERY_FEE = 5.00;
const STORE_OPEN = true;
const DELIVERY_TIME = "30-45 min";
const STATUS_STEPS = ["novo","aceito","preparo","entrega","entregue"];
const STATUS_LABELS = {novo:"Novo pedido",aceito:"Pedido aceito",preparo:"Em preparo",entrega:"Saiu para entrega",entregue:"Entregue",cancelado:"Cancelado"};
const CAT_LABELS = {acai:"🥤 Açaí no Copo",complementos:"🍓 Complementos",combos:"🎁 Combos"};

let currentUser=null, userProfile=null, cart=[], currentPage="home";
let adminFilter="todos", adminSubPage="pedidos";
let ordersUnsub=null, adminUnsub=null, menuUnsub=null;
let tempAddress=null, selectedPayment="";
let menuItems=[], editingProductId=null, productImgFile=null, productImgPreviewUrl=null;

// ===== TOAST =====
window.toast = (msg,type="info",dur=3000)=>{
  const el=document.createElement("div");
  el.className=`toast ${type}`; el.textContent=msg;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(()=>el.remove(),dur);
};

window.maskPhone = el=>{
  let v=el.value.replace(/\D/g,"");
  v=v.length<=10?v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3"):v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3");
  el.value=v;
};

// ===== AUTH =====
window.switchAuthTab = tab=>{
  document.getElementById("login-form").classList.toggle("hidden",tab!=="login");
  document.getElementById("register-form").classList.toggle("hidden",tab!=="register");
  document.querySelectorAll(".auth-tab").forEach((t,i)=>t.classList.toggle("active",(tab==="login"&&i===0)||(tab==="register"&&i===1)));
};

window.doLogin = async()=>{
  const email=document.getElementById("login-email").value.trim();
  const pass=document.getElementById("login-pass").value;
  if(!email||!pass){toast("Preencha todos os campos","error");return;}
  const btn=document.getElementById("login-btn");
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try{ await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){
    const msgs={"auth/invalid-credential":"E-mail ou senha incorretos","auth/too-many-requests":"Muitas tentativas. Tente mais tarde."};
    toast(msgs[e.code]||"Erro ao entrar","error");
    btn.disabled=false; btn.textContent="Entrar";
  }
};

window.doRegister = async()=>{
  const name=document.getElementById("reg-name").value.trim();
  const email=document.getElementById("reg-email").value.trim();
  const phone=document.getElementById("reg-phone").value.trim();
  const pass=document.getElementById("reg-pass").value;
  if(!name||!email||!pass){toast("Preencha os campos obrigatórios","error");return;}
  if(pass.length<6){toast("Senha deve ter mínimo 6 caracteres","error");return;}
  const btn=document.getElementById("reg-btn");
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,"users",cred.user.uid),{name,email,phone,role:"user",createdAt:serverTimestamp()});
    toast("Conta criada! Bem-vindo! 🎉","success");
  }catch(e){
    toast(e.code==="auth/email-already-in-use"?"E-mail já cadastrado":"Erro ao criar conta","error");
    btn.disabled=false; btn.textContent="Criar conta";
  }
};

window.doForgotPassword = async()=>{
  const email=document.getElementById("login-email").value.trim();
  if(!email){toast("Digite seu e-mail primeiro","error");return;}
  try{ await sendPasswordResetEmail(auth,email); toast("E-mail de redefinição enviado!","success",5000); }
  catch(e){ toast("Erro ao enviar e-mail","error"); }
};

// ===== AUTH STATE =====
onAuthStateChanged(auth,async user=>{
  document.getElementById("global-loading").style.display="none";
  if(user){
    currentUser=user;
    const snap=await getDoc(doc(db,"users",user.uid));
    userProfile=snap.exists()?snap.data():{name:user.email,role:"user"};
    if(user.email===ADMIN_EMAIL||userProfile.role==="admin"){
      userProfile.role="admin";
      document.getElementById("nav-admin").classList.remove("hidden");
    }
    const cartSnap=await getDoc(doc(db,"carts",user.uid));
    if(cartSnap.exists()) cart=cartSnap.data().items||[];
    updateCartBadge();
    document.getElementById("auth-screen").style.display="none";
    document.getElementById("app-screen").style.display="block";
    setupStoreBadge();
    listenMenu();
    listenOrders();
    navTo("home");
  } else {
    currentUser=null; userProfile=null; cart=[];
    document.getElementById("auth-screen").style.display="flex";
    document.getElementById("app-screen").style.display="none";
    [ordersUnsub,adminUnsub,menuUnsub].forEach(u=>{if(u)u();});
  }
});

// ===== MENU LISTENER =====
function listenMenu(){
  const q=query(collection(db,"products"),orderBy("createdAt","asc"));
  menuUnsub=onSnapshot(q,snap=>{
    menuItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==="home") navTo("home");
  });
}

// ===== STORE BADGE =====
function setupStoreBadge(){
  const b=document.getElementById("store-badge");
  b.textContent=STORE_OPEN?"🟢 Aberto":"🔴 Fechado";
  b.className="store-badge"+(STORE_OPEN?"":" closed");
}

// ===== NAV =====
window.navTo=page=>{
  currentPage=page;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const el=document.getElementById("nav-"+page);
  if(el) el.classList.add("active");
  const pages={home:renderHome,cart:renderCart,orders:renderOrders,profile:renderProfile,admin:renderAdmin};
  if(pages[page]) document.getElementById("main-content").innerHTML=pages[page]();
  if(page==="admin") setupAdminListeners();
};

// ===== HOME =====
function renderHome(){
  const cats=["acai","complementos","combos"];
  const sections=cats.map(cat=>{
    const items=menuItems.filter(i=>i.category===cat);
    if(!items.length) return "";
    return `<div class="sec-title">${CAT_LABELS[cat]}</div>
    <div class="items-grid">${items.map(itemCard).join("")}</div>`;
  }).join("");

  return `
    <div class="banner">
      <div class="banner-text">
        <h2>Olá, ${(userProfile?.name||"").split(" ")[0]||"cliente"}! 🍇</h2>
        <p>Delivery em ${DELIVERY_TIME} • Taxa R$ ${DELIVERY_FEE.toFixed(2).replace(".",",")}</p>
      </div>
      <div class="banner-emoji">🍇</div>
    </div>
    <div class="store-info">
      <div class="store-icon">🏪</div>
      <div class="store-details">
        <h3>Açaí do Delta</h3>
        <p>⏱ Entrega em ${DELIVERY_TIME}</p>
        <span class="store-status ${STORE_OPEN?"open":"closed"}">${STORE_OPEN?"🟢 Aberto agora":"🔴 Fechado"}</span>
      </div>
    </div>
    ${sections||`<div class="empty-state"><div class="empty-icon">🍇</div><p>Cardápio sendo preparado...</p></div>`}
  `;
}

function itemCard(item){
  const img=item.imageUrl
    ?`<img class="item-img" src="${item.imageUrl}" alt="${item.name}" loading="lazy"/>`
    :`<div class="item-img-placeholder">${item.emoji||"🥤"}</div>`;
  return `<div class="item-card">
    ${img}
    <div class="item-body">
      <div class="category-label">${CAT_LABELS[item.category]||item.category}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc||""}</div>
      <div class="item-bottom">
        <span class="item-price">R$ ${Number(item.price).toFixed(2).replace(".",",")}</span>
        <button class="add-btn" onclick="addToCart('${item.id}')">+ Adicionar</button>
      </div>
    </div>
  </div>`;
}

// ===== CART =====
window.addToCart=id=>{
  if(!STORE_OPEN){toast("A loja está fechada","error");return;}
  const item=menuItems.find(i=>i.id===id);
  if(!item) return;
  const ex=cart.find(c=>c.id===id);
  if(ex) ex.qty++;
  else cart.push({id:item.id,name:item.name,price:Number(item.price),emoji:item.emoji||"🥤",imageUrl:item.imageUrl||"",qty:1,obs:""});
  updateCartBadge(); saveCartToFirestore();
  toast(`${item.emoji||"🥤"} ${item.name} adicionado!`,"success",1500);
};

window.changeQty=(id,delta)=>{
  const idx=cart.findIndex(c=>c.id===id);
  if(idx<0) return;
  cart[idx].qty+=delta;
  if(cart[idx].qty<=0) cart.splice(idx,1);
  updateCartBadge(); saveCartToFirestore(); navTo("cart");
};

window.updateObs=(id,val)=>{ const item=cart.find(c=>c.id===id); if(item) item.obs=val; };

function updateCartBadge(){
  document.getElementById("cart-count").textContent=cart.reduce((s,i)=>s+i.qty,0);
}

async function saveCartToFirestore(){
  if(!currentUser) return;
  try{ await setDoc(doc(db,"carts",currentUser.uid),{items:cart,updatedAt:serverTimestamp()}); }catch(e){}
}

function renderCart(){
  if(!cart.length) return `<div class="empty-state"><div class="empty-icon">🛒</div><p>Seu carrinho está vazio</p>
    <button class="btn btn-primary mt16" style="width:auto;padding:10px 24px;" onclick="navTo('home')">Ver cardápio</button></div>`;
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.qty),0);
  const total=subtotal+DELIVERY_FEE;
  return `<div class="sec-title">🛒 Seu Carrinho</div>
    ${cart.map(item=>{
      const thumb=item.imageUrl
        ?`<img class="cart-thumb" src="${item.imageUrl}" style="width:52px;height:52px;border-radius:10px;object-fit:cover;"/>`
        :`<div class="cart-thumb">${item.emoji||"🥤"}</div>`;
      return `<div class="cart-item">
        <div class="cart-item-top">
          ${thumb}
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">R$ ${(item.price*item.qty).toFixed(2).replace(".",",")}</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
          </div>
        </div>
        <textarea class="obs-input" rows="1" placeholder="Observações (opcional)" onchange="updateObs('${item.id}',this.value)">${item.obs||""}</textarea>
      </div>`;
    }).join("")}
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2).replace(".",",")}</span></div>
      <div class="summary-row"><span>Taxa de entrega</span><span>R$ ${DELIVERY_FEE.toFixed(2).replace(".",",")}</span></div>
      <div class="summary-total"><span>Total</span><span>R$ ${total.toFixed(2).replace(".",",")}</span></div>
      <div class="pay-section">
        <div class="pay-title">💳 Forma de pagamento</div>
        <div class="pay-opts">
          <div class="pay-opt ${selectedPayment==="Pix"?"selected":""}" onclick="selectPay('Pix',this)">💸 Pix</div>
          <div class="pay-opt ${selectedPayment==="Cartão"?"selected":""}" onclick="selectPay('Cartão',this)">💳 Cartão</div>
          <div class="pay-opt ${selectedPayment==="Dinheiro"?"selected":""}" onclick="selectPay('Dinheiro',this)">💵 Dinheiro</div>
        </div>
      </div>
      <button class="checkout-btn" onclick="openAddrModal()">📍 Informar endereço e finalizar</button>
    </div>`;
}

window.selectPay=(method,el)=>{
  selectedPayment=method;
  document.querySelectorAll(".pay-opt").forEach(o=>o.classList.remove("selected"));
  el.classList.add("selected");
};

// ===== ADDRESS =====
window.openAddrModal=()=>{
  if(!selectedPayment){toast("Selecione a forma de pagamento","error");return;}
  const a=userProfile?.address;
  if(a){
    document.getElementById("addr-name").value=a.name||userProfile?.name||"";
    document.getElementById("addr-phone").value=a.phone||userProfile?.phone||"";
    document.getElementById("addr-street").value=a.street||"";
    document.getElementById("addr-num").value=a.num||"";
    document.getElementById("addr-neighborhood").value=a.neighborhood||"";
    document.getElementById("addr-comp").value=a.comp||"";
    document.getElementById("addr-ref").value=a.ref||"";
  } else {
    document.getElementById("addr-name").value=userProfile?.name||"";
    document.getElementById("addr-phone").value=userProfile?.phone||"";
  }
  document.getElementById("addr-modal").classList.add("show");
};
window.closeAddrModal=()=>document.getElementById("addr-modal").classList.remove("show");

window.confirmAddress=async()=>{
  const name=document.getElementById("addr-name").value.trim();
  const phone=document.getElementById("addr-phone").value.trim();
  const street=document.getElementById("addr-street").value.trim();
  const num=document.getElementById("addr-num").value.trim();
  const neighborhood=document.getElementById("addr-neighborhood").value.trim();
  if(!name||!phone||!street||!num||!neighborhood){toast("Preencha os campos obrigatórios (*)","error");return;}
  tempAddress={name,phone,street,num,neighborhood,
    comp:document.getElementById("addr-comp").value.trim(),
    ref:document.getElementById("addr-ref").value.trim()};
  if(document.getElementById("save-addr-check").checked){
    await updateDoc(doc(db,"users",currentUser.uid),{address:tempAddress});
    userProfile.address=tempAddress;
  }
  closeAddrModal(); placeOrder();
};

async function placeOrder(){
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.qty),0);
  const total=subtotal+DELIVERY_FEE;
  try{
    await addDoc(collection(db,"orders"),{
      userId:currentUser.uid,userEmail:currentUser.email,userName:userProfile?.name||"",
      items:cart.map(i=>({id:i.id,name:i.name,emoji:i.emoji||"🥤",imageUrl:i.imageUrl||"",price:i.price,qty:i.qty,obs:i.obs||""})),
      subtotal,deliveryFee:DELIVERY_FEE,total,payment:selectedPayment,
      address:tempAddress,status:"novo",createdAt:serverTimestamp()
    });
    cart=[]; selectedPayment=""; tempAddress=null;
    updateCartBadge();
    await setDoc(doc(db,"carts",currentUser.uid),{items:[],updatedAt:serverTimestamp()});
    toast("Pedido realizado! 🎉","success",4000);
    navTo("orders");
  }catch(e){ toast("Erro ao realizar pedido","error"); }
}

// ===== ORDERS =====
let myOrders=[];
function listenOrders(){
  if(!currentUser) return;
  const q=query(collection(db,"orders"),where("userId","==",currentUser.uid),orderBy("createdAt","desc"));
  ordersUnsub=onSnapshot(q,snap=>{
    myOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==="orders") navTo("orders");
  });
}

function renderOrders(){
  if(!myOrders.length) return `<div class="empty-state"><div class="empty-icon">📦</div><p>Você ainda não fez pedidos</p></div>`;
  return `<div class="sec-title">📦 Meus Pedidos</div>`+myOrders.map(o=>{
    const steps=STATUS_STEPS;
    const curIdx=steps.indexOf(o.status);
    const cancelled=o.status==="cancelado";
    const tl=cancelled?`<div class="badge badge-cancelado mt8">❌ Pedido cancelado</div>`:
      `<div class="timeline">${steps.map((s,i)=>{
        const done=i<curIdx,active=i===curIdx;
        return `<div class="tl-step"><div><div class="tl-dot ${done?"done":active?"active":""}"></div>${i<steps.length-1?`<div class="tl-line ${done?"done":""}"></div>`:""}</div>
          <div class="tl-label ${done?"done":active?"active":""}">${STATUS_LABELS[s]}</div></div>`;
      }).join("")}</div>`;
    const date=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("pt-BR"):"–";
    return `<div class="order-card">
      <div class="order-hdr"><div><div class="order-id">Pedido #${o.id.slice(-5).toUpperCase()}</div><div class="order-date">${date}</div></div></div>
      <div class="order-items-list">${o.items.map(i=>`${i.qty}x ${i.name}${i.obs?` (${i.obs})`:""}`).join(" · ")}</div>
      ${tl}
      <div class="order-footer">
        <div><div class="order-total">R$ ${o.total.toFixed(2).replace(".",",")}</div><div class="order-pay">${o.payment}</div></div>
        <button class="repeat-btn" onclick="repeatOrder('${o.id}')">🔁 Pedir novamente</button>
      </div>
    </div>`;
  }).join("");
}

window.repeatOrder=id=>{
  const order=myOrders.find(o=>o.id===id);
  if(!order) return;
  order.items.forEach(i=>{ const ex=cart.find(c=>c.id===i.id); if(ex) ex.qty+=i.qty; else cart.push({...i}); });
  updateCartBadge(); saveCartToFirestore();
  toast("Itens adicionados ao carrinho!","success"); navTo("cart");
};

// ===== PROFILE =====
function renderProfile(){
  const a=userProfile?.address;
  return `<div class="sec-title">👤 Meu Perfil</div>
    <div class="profile-card">
      <div style="text-align:center;margin-bottom:20px;">
        <div class="avatar-circle">${(userProfile?.name||"?")[0].toUpperCase()}</div>
        <div style="font-weight:700;margin-top:8px;">${userProfile?.name||""}</div>
        <div style="color:var(--sub);font-size:.85rem;">${currentUser?.email||""}</div>
      </div>
      <div class="form-grid">
        <div class="form-group full"><label>Nome</label><input id="pf-name" value="${userProfile?.name||""}"/></div>
        <div class="form-group full"><label>Telefone</label><input id="pf-phone" value="${userProfile?.phone||""}" oninput="maskPhone(this)"/></div>
      </div>
      <button class="btn btn-primary mt16" onclick="saveProfile()">💾 Salvar</button>
    </div>
    ${a?`<div class="profile-card"><div class="sec-title" style="margin-bottom:10px;">📍 Endereço salvo</div>
      <p style="color:var(--sub);font-size:.9rem;line-height:1.6;">${a.street}, ${a.num} – ${a.neighborhood}${a.comp?`<br>${a.comp}`:""}</p>
      <button class="btn btn-secondary mt8" style="width:auto;padding:8px 16px;font-size:.85rem;" onclick="openAddrModal()">✏️ Alterar</button></div>`:""}
    <button class="btn btn-danger mt8" onclick="doLogout()">🚪 Sair da conta</button>`;
}

window.saveProfile=async()=>{
  const name=document.getElementById("pf-name").value.trim();
  const phone=document.getElementById("pf-phone").value.trim();
  if(!name){toast("Digite seu nome","error");return;}
  await updateDoc(doc(db,"users",currentUser.uid),{name,phone});
  userProfile.name=name; userProfile.phone=phone;
  toast("Perfil salvo!","success");
};

window.doLogout=async()=>{ await signOut(auth); };

// ===== ADMIN =====
let adminOrders=[];

function setupAdminListeners(){
  if(adminUnsub) return;
  const q=query(collection(db,"orders"),orderBy("createdAt","desc"));
  adminUnsub=onSnapshot(q,snap=>{
    adminOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==="admin") navTo("admin");
  });
}

function renderAdmin(){
  if(userProfile?.role!=="admin") return `<div class="empty-state"><div class="empty-icon">🔒</div><p>Acesso restrito</p></div>`;
  return `<div class="sec-title">⚙️ Painel Admin</div>
    <div class="admin-tabs">
      <button class="admin-tab ${adminSubPage==="pedidos"?"active":""}" onclick="setAdminSub('pedidos')">📦 Pedidos</button>
      <button class="admin-tab ${adminSubPage==="cardapio"?"active":""}" onclick="setAdminSub('cardapio')">🍇 Cardápio</button>
    </div>
    ${adminSubPage==="pedidos"?renderAdminPedidos():renderAdminCardapio()}`;
}

window.setAdminSub=sub=>{ adminSubPage=sub; navTo("admin"); };

function renderAdminPedidos(){
  const today=new Date(); today.setHours(0,0,0,0);
  const todayOrders=adminOrders.filter(o=>o.createdAt?.toDate&&o.createdAt.toDate()>=today&&o.status!=="cancelado");
  const revenue=todayOrders.reduce((s,o)=>s+o.total,0);
  const filtered=adminFilter==="todos"?adminOrders:adminOrders.filter(o=>o.status===adminFilter);
  const filters=["todos","novo","aceito","preparo","entrega","entregue","cancelado"];
  const fLabels={todos:"Todos",novo:"Novos",aceito:"Aceitos",preparo:"Em preparo",entrega:"A caminho",entregue:"Entregues",cancelado:"Cancelados"};
  return `
    <div class="dashboard">
      <div class="dash-card"><div class="dash-val">${todayOrders.length}</div><div class="dash-label">Pedidos hoje</div></div>
      <div class="dash-card"><div class="dash-val">R$ ${revenue.toFixed(2).replace(".",",")}</div><div class="dash-label">Faturamento hoje</div></div>
      <div class="dash-card"><div class="dash-val">${adminOrders.filter(o=>o.status==="novo").length}</div><div class="dash-label">Aguardando</div></div>
    </div>
    <div class="filter-row">${filters.map(f=>`<button class="filter-btn ${adminFilter===f?"active":""}" onclick="setAdminFilter('${f}')">${fLabels[f]}</button>`).join("")}</div>
    ${filtered.length===0?`<div class="empty-state"><div class="empty-icon">📭</div><p>Nenhum pedido</p></div>`:
    filtered.map(o=>{
      const date=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("pt-BR"):"–";
      const a=o.address;
      return `<div class="admin-order">
        <div class="admin-order-hdr"><span class="admin-order-id">#${o.id.slice(-5).toUpperCase()}</span>
          <span class="badge badge-${o.status}">${STATUS_LABELS[o.status]||o.status}</span></div>
        <div class="admin-meta">👤 ${o.userName||o.userEmail} · 📱 ${a?.phone||"–"}</div>
        <div class="admin-meta">📍 ${a?`${a.street}, ${a.num} – ${a.neighborhood}${a.comp?` (${a.comp})`:""}${a.ref?` · Ref: ${a.ref}`:""}`:"-"}</div>
        <div class="admin-items-txt">${o.items.map(i=>`${i.qty}x ${i.name}${i.obs?` (${i.obs})`:""}`).join(" · ")}</div>
        <div style="color:var(--sub);font-size:.8rem;margin-bottom:8px;">${date} · ${o.payment}</div>
        <div class="admin-footer">
          <span class="admin-total">R$ ${o.total.toFixed(2).replace(".",",")}</span>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="cancel-btn" onclick="cancelOrder('${o.id}')">❌ Cancelar</button>
            <select class="status-select" onchange="changeStatus('${o.id}',this.value)">
              ${["novo","aceito","preparo","entrega","entregue","cancelado"].map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${STATUS_LABELS[s]}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>`;
    }).join("")}`;
}

function renderAdminCardapio(){
  const cats=["acai","complementos","combos"];
  return `
    <button class="add-product-btn" onclick="openProductModal()">➕ Adicionar novo produto</button>
    ${cats.map(cat=>{
      const items=menuItems.filter(i=>i.category===cat);
      return `<div class="sec-title">${CAT_LABELS[cat]}</div>
        <div class="product-grid">
          ${items.length?items.map(item=>{
            const img=item.imageUrl?`<img class="product-img" src="${item.imageUrl}"/>`:`<div class="product-img-placeholder">${item.emoji||"🥤"}</div>`;
            return `<div class="product-card">${img}
              <div class="product-body">
                <div class="product-name">${item.name}</div>
                <div class="product-price">R$ ${Number(item.price).toFixed(2).replace(".",",")}</div>
                <div class="product-actions">
                  <button class="edit-btn" onclick="openProductModal('${item.id}')">✏️ Editar</button>
                  <button class="del-btn" onclick="deleteProduct('${item.id}')">🗑️</button>
                </div>
              </div>
            </div>`;
          }).join(""):`<p style="color:var(--sub);font-size:.9rem;">Nenhum produto nesta categoria</p>`}
        </div>`;
    }).join("")}`;
}

window.setAdminFilter=f=>{ adminFilter=f; navTo("admin"); };
window.changeStatus=async(id,status)=>{
  try{ await updateDoc(doc(db,"orders",id),{status}); toast("Status atualizado!","success",1500); }
  catch(e){ toast("Erro ao atualizar","error"); }
};
window.cancelOrder=async id=>{
  try{ await updateDoc(doc(db,"orders",id),{status:"cancelado"}); toast("Pedido cancelado","info"); }
  catch(e){ toast("Erro","error"); }
};

// ===== PRODUCT MANAGER =====
window.openProductModal=id=>{
  editingProductId=id||null;
  productImgFile=null; productImgPreviewUrl=null;
  const modal=document.getElementById("product-modal");
  const title=document.getElementById("product-modal-title");
  const preview=document.getElementById("product-img-preview");
  const placeholder=document.getElementById("img-placeholder");

  if(id){
    const item=menuItems.find(i=>i.id===id);
    if(!item) return;
    title.innerHTML=`✏️ Editar Produto <button class="modal-close" onclick="closeProductModal()">✕</button>`;
    document.getElementById("prod-name").value=item.name||"";
    document.getElementById("prod-desc").value=item.desc||"";
    document.getElementById("prod-price").value=item.price||"";
    document.getElementById("prod-category").value=item.category||"acai";
    document.getElementById("prod-emoji").value=item.emoji||"";
    if(item.imageUrl){ preview.src=item.imageUrl; preview.style.display="block"; placeholder.style.display="none"; }
    else { preview.style.display="none"; placeholder.style.display="block"; }
  } else {
    title.innerHTML=`➕ Novo Produto <button class="modal-close" onclick="closeProductModal()">✕</button>`;
    document.getElementById("prod-name").value="";
    document.getElementById("prod-desc").value="";
    document.getElementById("prod-price").value="";
    document.getElementById("prod-category").value="acai";
    document.getElementById("prod-emoji").value="";
    preview.style.display="none"; placeholder.style.display="block";
  }
  modal.classList.add("show");
};

window.closeProductModal=()=>{
  document.getElementById("product-modal").classList.remove("show");
  editingProductId=null; productImgFile=null;
};

window.handleProductImg=e=>{
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){toast("Imagem muito grande (máx 5MB)","error");return;}
  productImgFile=file;
  const reader=new FileReader();
  reader.onload=ev=>{
    productImgPreviewUrl=ev.target.result;
    const preview=document.getElementById("product-img-preview");
    preview.src=ev.target.result; preview.style.display="block";
    document.getElementById("img-placeholder").style.display="none";
  };
  reader.readAsDataURL(file);
};

window.saveProduct=async()=>{
  const name=document.getElementById("prod-name").value.trim();
  const desc=document.getElementById("prod-desc").value.trim();
  const price=parseFloat(document.getElementById("prod-price").value);
  const category=document.getElementById("prod-category").value;
  const emoji=document.getElementById("prod-emoji").value.trim()||"🥤";
  if(!name||!price||!category){toast("Preencha nome, preço e categoria","error");return;}

  const btn=document.getElementById("save-product-btn");
  btn.disabled=true; btn.innerHTML='<span class="spinner-dark"></span> Salvando...';

  try{
    let imageUrl=editingProductId?menuItems.find(i=>i.id===editingProductId)?.imageUrl||"":"";
    if(productImgFile){
      const imgRef=ref(storage,`products/${Date.now()}_${productImgFile.name}`);
      await uploadBytes(imgRef,productImgFile);
      imageUrl=await getDownloadURL(imgRef);
    }
    const data={name,desc,price,category,emoji,imageUrl,updatedAt:serverTimestamp()};
    if(editingProductId){
      await updateDoc(doc(db,"products",editingProductId),data);
      toast("Produto atualizado! ✅","success");
    } else {
      await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
      toast("Produto adicionado! ✅","success");
    }
    closeProductModal();
  }catch(e){
    console.error(e); toast("Erro ao salvar produto","error");
  }finally{
    btn.disabled=false; btn.textContent="💾 Salvar produto";
  }
};

window.deleteProduct=async id=>{
  if(!confirm("Tem certeza que deseja remover este produto?")) return;
  try{
    await deleteDoc(doc(db,"products",id));
    toast("Produto removido","info");
  }catch(e){ toast("Erro ao remover","error"); }
};
</script>
</body>
