<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Echeverria's Gourmet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#1a5c2e;
  --green2:#2d7a45;
  --gold:#c9a84c;
  --gold2:#e8c96d;
  --cream:#f8f5ef;
  --cream2:#f0ebe0;
  --white:#ffffff;
  --txt:#1c1c1c;
  --sub:#6b6b6b;
  --border:#e0d8c8;
  --sh:0 2px 16px rgba(0,0,0,0.07);
  --sh2:0 8px 40px rgba(0,0,0,0.12);
  --grad:linear-gradient(135deg,#1a5c2e,#2d7a45);
  --gradgold:linear-gradient(135deg,#c9a84c,#e8c96d);
}
body{font-family:'Inter',sans-serif;background:var(--cream);min-height:100vh;color:var(--txt);}

/* TOAST */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:12px;font-weight:600;font-size:.88rem;box-shadow:var(--sh2);animation:slideIn .3s ease;max-width:300px;}
.toast.success{background:#d1fae5;color:#065f46;border-left:4px solid #10b981;}
.toast.error{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444;}
.toast.info{background:#fef9e7;color:#92400e;border-left:4px solid var(--gold);}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* LOADING */
#global-loading{position:fixed;inset:0;background:var(--grad);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;gap:16px;}
.loading-logo{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:3rem;animation:pulse 1.5s infinite;}
#global-loading h1{color:#fff;font-family:'Playfair Display',serif;font-size:1.6rem;letter-spacing:.5px;}
#global-loading p{color:rgba(255,255,255,.7);font-size:.9rem;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.85}}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
.spinner-g{width:18px;height:18px;border:2.5px solid rgba(26,92,46,.2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* AUTH */
#auth-screen{display:none;min-height:100vh;background:var(--cream);align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
#auth-screen::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:var(--grad);border-radius:0 0 40px 40px;}
.auth-box{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:var(--sh2);position:relative;z-index:1;}
.auth-logo-wrap{text-align:center;margin-bottom:6px;}
.auth-brand-icon{width:72px;height:72px;border-radius:50%;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:10px;box-shadow:0 4px 20px rgba(26,92,46,.3);}
.auth-title{text-align:center;font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--green);margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--sub);font-size:.88rem;margin-bottom:24px;}
.auth-tabs{display:flex;margin-bottom:22px;border-radius:12px;overflow:hidden;background:var(--cream2);padding:4px;gap:4px;}
.auth-tab{flex:1;padding:9px;text-align:center;cursor:pointer;font-weight:600;font-size:.88rem;border-radius:9px;color:var(--sub);transition:.2s;}
.auth-tab.active{background:#fff;color:var(--green);box-shadow:var(--sh);}
.field{margin-bottom:14px;}
.field label{display:block;font-weight:600;font-size:.82rem;color:var(--txt);margin-bottom:6px;letter-spacing:.3px;}
.field input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;outline:none;transition:.2s;background:#fafaf8;font-family:'Inter',sans-serif;}
.field input:focus{border-color:var(--green);background:#fff;}
.btn-auth{width:100%;padding:14px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;letter-spacing:.3px;}
.btn-auth:hover{opacity:.9;transform:translateY(-1px);}
.btn-auth:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.forgot-link{text-align:center;margin-top:12px;font-size:.83rem;color:var(--green);cursor:pointer;font-weight:600;}
.forgot-link:hover{text-decoration:underline;}

/* HEADER */
#app-screen{display:none;}
header{background:#fff;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,.06);}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-icon{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.logo-text{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--green);line-height:1.1;}
.logo-sub{font-size:.65rem;color:var(--gold);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;}
.store-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;margin-left:8px;}
.store-pill.open{background:#d1fae5;color:#065f46;}
.store-pill.closed{background:#fee2e2;color:#991b1b;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.hdr-cart{background:var(--grad);border:none;color:#fff;padding:9px 16px;border-radius:20px;cursor:pointer;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px;transition:.2s;}
.hdr-cart:hover{opacity:.9;}
.cart-badge{background:#fff;color:var(--green);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -2px 16px rgba(0,0,0,.06);}
.nav-item{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--sub);font-size:.67rem;font-weight:600;transition:.2s;letter-spacing:.2px;}
.nav-item.active{color:var(--green);}
.nav-item.active .nav-icon{background:rgba(26,92,46,.08);border-radius:12px;}
.nav-icon{font-size:1.35rem;padding:4px 10px;}

/* MAIN */
.main{padding:16px 16px 90px;}

/* HERO */
.hero{background:var(--grad);border-radius:20px;padding:24px 20px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;}
.hero::after{content:'🎂';position:absolute;right:-10px;bottom:-10px;font-size:6rem;opacity:.15;}
.hero-greeting{font-size:.85rem;opacity:.8;margin-bottom:4px;}
.hero-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;margin-bottom:6px;}
.hero-info{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.hero-chip{background:rgba(255,255,255,.18);padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:4px;}

/* CATEGORY PILLS */
.cat-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none;}
.cat-pills::-webkit-scrollbar{display:none;}
.cat-pill{padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--sub);cursor:pointer;font-weight:600;font-size:.83rem;white-space:nowrap;transition:.2s;flex-shrink:0;}
.cat-pill.active{background:var(--green);color:#fff;border-color:var(--green);}

/* SECTION TITLE */
.sec-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--txt);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ITEMS */
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:28px;}
.item-card{background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden;transition:.25s;cursor:pointer;}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);}
.item-img-wrap{width:100%;height:150px;position:relative;overflow:hidden;background:var(--cream2);}
.item-img-wrap img{width:100%;height:100%;object-fit:cover;transition:.3s;}
.item-card:hover .item-img-wrap img{transform:scale(1.05);}
.item-emoji-bg{width:100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,#f0ebe0,#e8e0d0);}
.item-body{padding:14px;}
.item-cat-tag{display:inline-block;background:rgba(201,168,76,.15);color:var(--gold);padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.item-name{font-weight:700;font-size:.95rem;color:var(--txt);margin-bottom:4px;line-height:1.3;}
.item-desc{color:var(--sub);font-size:.8rem;margin-bottom:12px;line-height:1.45;}
.item-footer{display:flex;align-items:center;justify-content:space-between;}
.item-price{font-weight:800;color:var(--green);font-size:1.05rem;}
.add-btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:.82rem;transition:.2s;display:flex;align-items:center;gap:4px;}
.add-btn:hover{background:var(--green2);}

/* CART */
.cart-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
.cart-item-row{display:flex;align-items:flex-start;gap:12px;}
.cart-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.cart-info{flex:1;}
.cart-name{font-weight:700;font-size:.92rem;color:var(--txt);}
.cart-price{color:var(--green);font-weight:700;font-size:.88rem;margin-top:2px;}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.qty-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:1rem;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s;}
.qty-btn:hover{background:var(--green);color:#fff;}
.qty-num{font-weight:700;min-width:24px;text-align:center;font-size:.95rem;}
.obs-field{width:100%;margin-top:8px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;outline:none;resize:none;font-family:'Inter',sans-serif;background:#fafaf8;}
.obs-field:focus{border-color:var(--green);}

/* CART SUMMARY */
.cart-summary{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--sh);margin-top:14px;}
.summary-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--sub);margin-bottom:8px;}
.summary-divider{height:1px;background:var(--border);margin:10px 0;}
.summary-total{display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem;color:var(--txt);}
.pay-section{margin-top:18px;}
.pay-label{font-weight:700;font-size:.9rem;color:var(--txt);margin-bottom:10px;}
.pay-opts{display:flex;gap:8px;flex-wrap:wrap;}
.pay-opt{padding:10px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;display:flex;align-items:center;gap:6px;}
.pay-opt:hover{border-color:var(--green);}
.pay-opt.selected{border-color:var(--green);background:rgba(26,92,46,.06);color:var(--green);}
.checkout-btn{width:100%;margin-top:16px;padding:15px;background:var(--grad);color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.3px;}
.checkout-btn:hover{opacity:.9;transform:translateY(-1px);}

/* EMPTY */
.empty-state{text-align:center;padding:56px 20px;color:var(--sub);}
.empty-icon{font-size:3.5rem;margin-bottom:14px;}
.empty-state p{font-size:.95rem;line-height:1.6;}
.btn-go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:11px 24px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s;}
.btn-go:hover{opacity:.9;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:24px 24px 0 0;padding:28px 22px 32px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.4,0,.2,1);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hdr{display:flex;align-items:center;margin-bottom:22px;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--green);display:flex;align-items:center;gap:8px;}
.modal-close{margin-left:auto;background:var(--cream2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--sub);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.fgroup{display:flex;flex-direction:column;gap:5px;}
.fgroup label{font-weight:600;font-size:.8rem;color:var(--txt);letter-spacing:.3px;}
.fgroup input,.fgroup select,.fgroup textarea{padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;outline:none;transition:.2s;font-family:'Inter',sans-serif;background:#fafaf8;}
.fgroup input:focus,.fgroup select:focus,.fgroup textarea:focus{border-color:var(--green);background:#fff;}
.save-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.88rem;font-weight:600;color:var(--txt);cursor:pointer;}
.btn-confirm{width:100%;margin-top:16px;padding:14px;background:var(--grad);color:#fff;border:none;border-radius:12px;font-size:.92rem;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.3px;}
.btn-confirm:hover{opacity:.9;}
.btn-confirm:disabled{opacity:.6;cursor:not-allowed;}

/* ORDERS */
.order-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--sh);}
.order-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-id{font-weight:800;color:var(--green);font-size:.95rem;}
.order-date{color:var(--sub);font-size:.78rem;margin-top:2px;}
.order-items-txt{color:var(--sub);font-size:.82rem;margin-bottom:14px;line-height:1.5;}
.timeline{display:flex;flex-direction:column;}
.tl-row{display:flex;gap:12px;}
.tl-left{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);background:#fff;flex-shrink:0;}
.tl-dot.done{background:var(--green);border-color:var(--green);}
.tl-dot.active{background:#fff;border-color:var(--green);box-shadow:0 0 0 4px rgba(26,92,46,.12);}
.tl-line{width:2px;flex:1;background:var(--border);margin:2px 0;}
.tl-line.done{background:var(--green);}
.tl-text{font-size:.82rem;font-weight:600;color:var(--sub);padding-bottom:14px;padding-top:1px;}
.tl-text.done,.tl-text.active{color:var(--txt);}
.order-ftr{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);margin-top:4px;flex-wrap:wrap;gap:8px;}
.order-total-val{font-weight:800;color:var(--green);}
.order-pay-txt{font-size:.78rem;color:var(--sub);}
.repeat-btn{padding:7px 14px;background:rgba(26,92,46,.08);color:var(--green);border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem;transition:.2s;}
.repeat-btn:hover{background:rgba(26,92,46,.15);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;}
.badge-novo{background:#fef9e7;color:#92400e;}
.badge-aceito{background:#dbeafe;color:#1e40af;}
.badge-preparo{background:rgba(201,168,76,.15);color:#7a5c00;}
.badge-entrega{background:#ede9fe;color:#5b21b6;}
.badge-entregue{background:#d1fae5;color:#065f46;}
.badge-cancelado{background:#fee2e2;color:#991b1b;}

/* ADMIN */
.admin-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--cream2);padding:4px;border-radius:14px;}
.admin-tab{flex:1;padding:9px;text-align:center;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:.85rem;background:transparent;color:var(--sub);transition:.2s;}
.admin-tab.active{background:#fff;color:var(--green);box-shadow:var(--sh);}
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:22px;}
.dash-card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--sh);text-align:center;}
.dash-val{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;color:var(--green);}
.dash-label{font-size:.75rem;color:var(--sub);margin-top:4px;font-weight:500;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--sub);cursor:pointer;font-weight:600;font-size:.78rem;white-space:nowrap;transition:.2s;}
.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green);}
.admin-order{background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--sh);}
.admin-order-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.admin-order-id{font-weight:800;color:var(--green);font-size:.9rem;}
.admin-meta{color:var(--sub);font-size:.8rem;margin-bottom:3px;line-height:1.4;}
.admin-items-txt{color:var(--txt);font-size:.85rem;margin:8px 0;line-height:1.5;}
.admin-ftr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
.admin-total{font-weight:800;color:var(--green);}
.status-select{padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);font-weight:600;cursor:pointer;outline:none;font-size:.8rem;background:#fff;font-family:'Inter',sans-serif;}
.cancel-btn{padding:6px 12px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.78rem;}

/* CARDAPIO ADMIN */
.add-prod-btn{width:100%;padding:13px;background:var(--grad);color:#fff;border:none;border-radius:12px;font-size:.92rem;font-weight:700;cursor:pointer;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;}
.add-prod-btn:hover{opacity:.9;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px;}
.prod-card{background:#fff;border-radius:14px;box-shadow:var(--sh);overflow:hidden;}
.prod-img{width:100%;height:110px;object-fit:cover;background:var(--cream2);}
.prod-emoji-bg{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;background:linear-gradient(135deg,#f0ebe0,#e8e0d0);}
.prod-body{padding:12px;}
.prod-name{font-weight:700;font-size:.88rem;margin-bottom:2px;}
.prod-price{color:var(--green);font-weight:800;font-size:.9rem;margin-bottom:8px;}
.prod-actions{display:flex;gap:6px;}
.edit-btn{flex:1;padding:6px;background:rgba(26,92,46,.08);color:var(--green);border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.78rem;transition:.2s;}
.edit-btn:hover{background:rgba(26,92,46,.15);}
.del-btn{padding:6px 10px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.78rem;}

/* PRODUCT MODAL IMG */
.img-upload-area{width:100%;height:150px;border-radius:12px;overflow:hidden;background:var(--cream2);display:flex;align-items:center;justify-content:center;margin-bottom:14px;cursor:pointer;border:2px dashed var(--border);position:relative;transition:.2s;}
.img-upload-area:hover{border-color:var(--green);}
.img-upload-area img{width:100%;height:100%;object-fit:cover;}
.img-upload-label{color:var(--sub);font-size:.85rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;}
.img-upload-label span{font-size:1.8rem;}
.img-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;opacity:0;transition:.2s;}
.img-upload-area:hover .img-overlay{opacity:1;}

/* PROFILE */
.profile-card{background:#fff;border-radius:16px;padding:22px;box-shadow:var(--sh);margin-bottom:14px;}
.profile-avatar{width:76px;height:76px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.8rem;color:#fff;font-weight:700;margin:0 auto 12px;}
.profile-name{text-align:center;font-weight:700;font-size:1rem;}
.profile-email{text-align:center;color:var(--sub);font-size:.82rem;margin-top:2px;}
.btn-save{width:100%;padding:13px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;margin-top:14px;transition:.2s;}
.btn-save:hover{opacity:.9;}
.btn-logout{width:100%;padding:13px;background:#fee2e2;color:#991b1b;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;margin-top:10px;transition:.2s;}
.btn-logout:hover{background:#fecaca;}
.addr-preview{color:var(--sub);font-size:.85rem;line-height:1.6;margin-bottom:8px;}
.btn-outline{padding:8px 16px;background:transparent;border:1.5px solid var(--green);color:var(--green);border-radius:8px;cursor:pointer;font-weight:700;font-size:.82rem;transition:.2s;}
.btn-outline:hover{background:rgba(26,92,46,.06);}

.hidden{display:none!important;}
.mt8{margin-top:8px;}
.mt14{margin-top:14px;}
.mt20{margin-top:20px;}
</style>
</head>
<body>

<!-- LOADING -->
<div id="global-loading">
  <div class="loading-logo">🎂</div>
  <h1>Echeverria's Gourmet</h1>
  <p>Doceria & Confeitaria</p>
</div>

<div id="toast-container"></div>

<!-- AUTH -->
<div id="auth-screen" style="display:flex;">
  <div class="auth-box">
    <div class="auth-logo-wrap">
      <img src="https://i.imgur.com/fn8uIAV.png" alt="Echeverria's Gourmet" style="width:180px;height:180px;object-fit:contain;border-radius:50%;margin-bottom:4px;"/>
      <div class="auth-sub">Doceria & Confeitaria • Pedidos online</div>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">Entrar</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">Cadastrar</div>
    </div>
    <div id="login-form">
      <div class="field"><label>E-MAIL</label><input type="email" id="login-email" placeholder="seu@email.com"/></div>
      <div class="field"><label>SENHA</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn-auth" id="login-btn" onclick="doLogin()">Entrar na conta</button>
      <div class="forgot-link" onclick="doForgotPassword()">Esqueci minha senha</div>
    </div>
    <div id="register-form" class="hidden">
      <div class="field"><label>NOME COMPLETO</label><input type="text" id="reg-name" placeholder="Seu nome"/></div>
      <div class="field"><label>E-MAIL</label><input type="email" id="reg-email" placeholder="seu@email.com"/></div>
      <div class="field"><label>TELEFONE</label><input type="tel" id="reg-phone" placeholder="(67) 99999-9999" oninput="maskPhone(this)"/></div>
      <div class="field"><label>SENHA</label><input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"/></div>
      <button class="btn-auth" id="reg-btn" onclick="doRegister()">Criar minha conta</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <div class="logo-wrap">
      <img src="https://i.imgur.com/fn8uIAV.png" alt="Logo" style="width:52px;height:52px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;"/>
      <div>
        <div class="logo-text">Echeverria's Gourmet</div>
        <div class="logo-sub">Doceria</div>
      </div>
      <span class="store-pill open" id="store-badge">● Aberto</span>
    </div>
    <div class="hdr-right">
      <button class="hdr-cart" onclick="navTo('cart')">🛒 <span class="cart-badge" id="cart-count">0</span></button>
    </div>
  </header>

  <div class="main" id="main-content"></div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="navTo('home')"><span class="nav-icon">🏠</span>Início</button>
    <button class="nav-item" id="nav-cart" onclick="navTo('cart')"><span class="nav-icon">🛒</span>Carrinho</button>
    <button class="nav-item" id="nav-orders" onclick="navTo('orders')"><span class="nav-icon">📦</span>Pedidos</button>
    <button class="nav-item" id="nav-profile" onclick="navTo('profile')"><span class="nav-icon">👤</span>Perfil</button>
    <button class="nav-item hidden" id="nav-admin" onclick="navTo('admin')"><span class="nav-icon">⚙️</span>Admin</button>
  </nav>
</div>

<!-- ADDRESS MODAL -->
<div class="modal-overlay" id="addr-modal">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="modal-title">📍 Endereço de entrega</div>
      <button class="modal-close" onclick="closeAddrModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="fgroup full"><label>NOME COMPLETO *</label><input type="text" id="addr-name"/></div>
      <div class="fgroup full"><label>TELEFONE *</label><input type="tel" id="addr-phone" oninput="maskPhone(this)" placeholder="(67) 99999-9999"/></div>
      <div class="fgroup full"><label>RUA *</label><input type="text" id="addr-street"/></div>
      <div class="fgroup"><label>NÚMERO *</label><input type="text" id="addr-num"/></div>
      <div class="fgroup"><label>BAIRRO *</label><input type="text" id="addr-neighborhood"/></div>
      <div class="fgroup"><label>COMPLEMENTO</label><input type="text" id="addr-comp"/></div>
      <div class="fgroup"><label>REFERÊNCIA</label><input type="text" id="addr-ref"/></div>
    </div>
    <label class="save-check"><input type="checkbox" id="save-addr-check" checked/> Salvar endereço para próximos pedidos</label>
    <button class="btn-confirm" onclick="confirmAddress()">Confirmar endereço ✓</button>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="modal-title" id="product-modal-title">➕ Novo Produto</div>
      <button class="modal-close" onclick="closeProductModal()">✕</button>
    </div>
    <div class="img-upload-area" onclick="document.getElementById('prod-img-input').click()">
      <img id="prod-img-preview" src="" style="display:none;"/>
      <div class="img-upload-label" id="img-upload-label"><span>📷</span>Clique para adicionar foto</div>
      <div class="img-overlay">Trocar foto</div>
    </div>
    <input type="file" id="prod-img-input" accept="image/*" style="display:none;" onchange="handleProductImg(event)"/>
    <div class="form-grid">
      <div class="fgroup full"><label>NOME DO PRODUTO *</label><input type="text" id="prod-name" placeholder="Ex: Bolo de Chocolate"/></div>
      <div class="fgroup full"><label>DESCRIÇÃO</label><input type="text" id="prod-desc" placeholder="Ex: Bolo cremoso com ganache"/></div>
      <div class="fgroup"><label>PREÇO (R$) *</label><input type="number" id="prod-price" placeholder="0,00" step="0.01" min="0"/></div>
      <div class="fgroup"><label>CATEGORIA *</label>
        <select id="prod-category">
          <option value="bolos">🎂 Bolos</option>
          <option value="doces">🍬 Doces & Brigadeiros</option>
          <option value="tortas">🥧 Tortas</option>
          <option value="salgados">🥐 Salgados</option>
          <option value="bebidas">☕ Bebidas</option>
          <option value="outros">✨ Outros</option>
        </select>
      </div>
      <div class="fgroup"><label>EMOJI</label><input type="text" id="prod-emoji" placeholder="🎂" maxlength="2"/></div>
    </div>
    <button class="btn-confirm mt14" id="save-product-btn" onclick="saveProduct()">💾 Salvar produto</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection,
  addDoc, query, where, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPNDXI9Ii0-3Xa4F5YRqHgcCAwcaErjAQ",
  authDomain: "acai-do-delta.firebaseapp.com",
  projectId: "acai-do-delta",
  storageBucket: "acai-do-delta.firebasestorage.app",
  messagingSenderId: "593981403306",
  appId: "1:593981403306:web:6c58398a78c8ccac17a0d3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const ADMIN_EMAIL = "vinycius.fernandes.ms@gmail.com";
const DELIVERY_FEE = 8.00;
const STORE_OPEN = true;
const DELIVERY_TIME = "40-60 min";

const STATUS_STEPS = ["novo","aceito","preparo","entrega","entregue"];
const STATUS_LABELS = {novo:"Pedido recebido",aceito:"Pedido aceito",preparo:"Em preparo",entrega:"Saiu para entrega",entregue:"Entregue",cancelado:"Cancelado"};
const CAT_LABELS = {bolos:"🎂 Bolos",doces:"🍬 Doces & Brigadeiros",tortas:"🥧 Tortas",salgados:"🥐 Salgados",bebidas:"☕ Bebidas",outros:"✨ Outros"};
const ALL_CATS = ["bolos","doces","tortas","salgados","bebidas","outros"];

let currentUser=null,userProfile=null,cart=[],currentPage="home";
let adminFilter="todos",adminSubPage="pedidos";
let ordersUnsub=null,adminUnsub=null,menuUnsub=null;
let tempAddress=null,selectedPayment="",activeCat="todos";
let menuItems=[],editingProductId=null,productImgFile=null;

window.toast=(msg,type="info",dur=3000)=>{
  const el=document.createElement("div");
  el.className=`toast ${type}`;el.textContent=msg;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(()=>el.remove(),dur);
};
window.maskPhone=el=>{
  let v=el.value.replace(/\D/g,"");
  v=v.length<=10?v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3"):v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3");
  el.value=v;
};

window.switchAuthTab=tab=>{
  document.getElementById("login-form").classList.toggle("hidden",tab!=="login");
  document.getElementById("register-form").classList.toggle("hidden",tab!=="register");
  document.querySelectorAll(".auth-tab").forEach((t,i)=>t.classList.toggle("active",(tab==="login"&&i===0)||(tab==="register"&&i===1)));
};

window.doLogin=async()=>{
  const email=document.getElementById("login-email").value.trim();
  const pass=document.getElementById("login-pass").value;
  if(!email||!pass){toast("Preencha todos os campos","error");return;}
  const btn=document.getElementById("login-btn");
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{await signInWithEmailAndPassword(auth,email,pass);}
  catch(e){
    const msgs={"auth/invalid-credential":"E-mail ou senha incorretos","auth/too-many-requests":"Muitas tentativas. Tente mais tarde."};
    toast(msgs[e.code]||"Erro ao entrar","error");
    btn.disabled=false;btn.textContent="Entrar na conta";
  }
};

window.doRegister=async()=>{
  const name=document.getElementById("reg-name").value.trim();
  const email=document.getElementById("reg-email").value.trim();
  const phone=document.getElementById("reg-phone").value.trim();
  const pass=document.getElementById("reg-pass").value;
  if(!name||!email||!pass){toast("Preencha os campos obrigatórios","error");return;}
  if(pass.length<6){toast("Senha mínimo 6 caracteres","error");return;}
  const btn=document.getElementById("reg-btn");
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,"users",cred.user.uid),{name,email,phone,role:"user",createdAt:serverTimestamp()});
    toast("Bem-vindo(a)! 🎂","success");
  }catch(e){
    toast(e.code==="auth/email-already-in-use"?"E-mail já cadastrado":"Erro ao criar conta","error");
    btn.disabled=false;btn.textContent="Criar minha conta";
  }
};

window.doForgotPassword=async()=>{
  const email=document.getElementById("login-email").value.trim();
  if(!email){toast("Digite seu e-mail primeiro","error");return;}
  try{await sendPasswordResetEmail(auth,email);toast("E-mail de redefinição enviado!","success",5000);}
  catch(e){toast("Erro ao enviar e-mail","error");}
};

onAuthStateChanged(auth,async user=>{
  document.getElementById("global-loading").style.display="none";
  if(user){
    currentUser=user;
    const snap=await getDoc(doc(db,"users",user.uid));
    userProfile=snap.exists()?snap.data():{name:user.email,role:"user"};
    if(user.email===ADMIN_EMAIL||userProfile.role==="admin"){
      userProfile.role="admin";
      document.getElementById("nav-admin").classList.remove("hidden");
    } else {
      document.getElementById("nav-admin").classList.add("hidden");
    }
    const cartSnap=await getDoc(doc(db,"carts",user.uid));
    if(cartSnap.exists()) cart=cartSnap.data().items||[];
    updateCartBadge();
    document.getElementById("auth-screen").style.display="none";
    document.getElementById("app-screen").style.display="block";
    listenMenu();listenOrders();navTo("home");
  } else {
    currentUser=null;userProfile=null;cart=[];
    document.getElementById("auth-screen").style.display="flex";
    document.getElementById("app-screen").style.display="none";
    [ordersUnsub,adminUnsub,menuUnsub].forEach(u=>{if(u)u();});
  }
});

function listenMenu(){
  menuUnsub=onSnapshot(query(collection(db,"products"),orderBy("createdAt","asc")),snap=>{
    menuItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==="home") navTo("home");
  });
}

window.navTo=page=>{
  currentPage=page;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const el=document.getElementById("nav-"+page);
  if(el) el.classList.add("active");
  const pages={home:renderHome,cart:renderCart,orders:renderOrders,profile:renderProfile,admin:renderAdmin};
  if(pages[page]) document.getElementById("main-content").innerHTML=pages[page]();
  if(page==="admin") setupAdminListeners();
};

function renderHome(){
  const filtered=activeCat==="todos"?menuItems:menuItems.filter(i=>i.category===activeCat);
  const cats=ALL_CATS.filter(c=>menuItems.some(i=>i.category===c));

  return `
    <div class="hero">
      <div class="hero-greeting">Olá, ${(userProfile?.name||"").split(" ")[0]||"cliente"}! 👋</div>
      <div class="hero-title">O que vai ser hoje?</div>
      <div class="hero-info">
        <div class="hero-chip">⏱ ${DELIVERY_TIME}</div>
        <div class="hero-chip">🚚 Taxa R$ ${DELIVERY_FEE.toFixed(2).replace(".",",")}</div>
        <div class="hero-chip">${STORE_OPEN?"🟢 Aberto":"🔴 Fechado"}</div>
      </div>
    </div>
    <div class="cat-pills">
      <div class="cat-pill ${activeCat==="todos"?"active":""}" onclick="setCat('todos')">Todos</div>
      ${cats.map(c=>`<div class="cat-pill ${activeCat===c?"active":""}" onclick="setCat('${c}')">${CAT_LABELS[c]}</div>`).join("")}
    </div>
    ${filtered.length===0
      ?`<div class="empty-state"><div class="empty-icon">🎂</div><p>Cardápio sendo preparado com carinho...</p></div>`
      :cats.filter(c=>activeCat==="todos"?true:c===activeCat).map(cat=>{
          const items=filtered.filter(i=>i.category===cat);
          if(!items.length) return "";
          return `<div class="sec-title">${CAT_LABELS[cat]}</div>
            <div class="items-grid">${items.map(itemCard).join("")}</div>`;
        }).join("")
    }`;
}

window.setCat=cat=>{activeCat=cat;navTo("home");};

function itemCard(item){
  const img=item.imageUrl
    ?`<div class="item-img-wrap"><img src="${item.imageUrl}" alt="${item.name}" loading="lazy"/></div>`
    :`<div class="item-emoji-bg">${item.emoji||"🎂"}</div>`;
  return `<div class="item-card">
    ${img}
    <div class="item-body">
      <div class="item-cat-tag">${(CAT_LABELS[item.category]||item.category).replace(/^\S+\s/,"")}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc||""}</div>
      <div class="item-footer">
        <span class="item-price">R$ ${Number(item.price).toFixed(2).replace(".",",")}</span>
        <button class="add-btn" onclick="addToCart('${item.id}')">+ Adicionar</button>
      </div>
    </div>
  </div>`;
}

window.addToCart=id=>{
  if(!STORE_OPEN){toast("A loja está fechada no momento","error");return;}
  const item=menuItems.find(i=>i.id===id);
  if(!item) return;
  const ex=cart.find(c=>c.id===id);
  if(ex) ex.qty++;
  else cart.push({id:item.id,name:item.name,price:Number(item.price),emoji:item.emoji||"🎂",imageUrl:item.imageUrl||"",qty:1,obs:""});
  updateCartBadge();saveCartToFirestore();
  toast(`${item.emoji||"🎂"} ${item.name} adicionado!`,"success",1500);
};
window.changeQty=(id,delta)=>{
  const idx=cart.findIndex(c=>c.id===id);if(idx<0)return;
  cart[idx].qty+=delta;if(cart[idx].qty<=0)cart.splice(idx,1);
  updateCartBadge();saveCartToFirestore();navTo("cart");
};
window.updateObs=(id,val)=>{const item=cart.find(c=>c.id===id);if(item)item.obs=val;};
function updateCartBadge(){document.getElementById("cart-count").textContent=cart.reduce((s,i)=>s+i.qty,0);}
async function saveCartToFirestore(){
  if(!currentUser)return;
  try{await setDoc(doc(db,"carts",currentUser.uid),{items:cart,updatedAt:serverTimestamp()});}catch(e){}
}

function renderCart(){
  if(!cart.length) return `<div class="empty-state"><div class="empty-icon">🛒</div><p>Seu carrinho está vazio</p><button class="btn-go" onclick="navTo('home')">Ver cardápio</button></div>`;
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.qty),0);
  const total=subtotal+DELIVERY_FEE;
  return `<div class="sec-title">🛒 Meu Carrinho</div>
    ${cart.map(item=>{
      const thumb=item.imageUrl?`<img class="cart-thumb" src="${item.imageUrl}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"/>`:`<div class="cart-thumb">${item.emoji||"🎂"}</div>`;
      return `<div class="cart-item">
        <div class="cart-item-row">${thumb}
          <div class="cart-info">
            <div class="cart-name">${item.name}</div>
            <div class="cart-price">R$ ${(item.price*item.qty).toFixed(2).replace(".",",")}</div>
          </div>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
          </div>
        </div>
        <textarea class="obs-field" rows="1" placeholder="Observações para este item..." onchange="updateObs('${item.id}',this.value)">${item.obs||""}</textarea>
      </div>`;
    }).join("")}
    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2).replace(".",",")}</span></div>
      <div class="summary-row"><span>Taxa de entrega</span><span>R$ ${DELIVERY_FEE.toFixed(2).replace(".",",")}</span></div>
      <div class="summary-divider"></div>
      <div class="summary-total"><span>Total</span><span>R$ ${total.toFixed(2).replace(".",",")}</span></div>
      <div class="pay-section">
        <div class="pay-label">Forma de pagamento</div>
        <div class="pay-opts">
          <div class="pay-opt ${selectedPayment==="Pix"?"selected":""}" onclick="selectPay('Pix',this)">💸 Pix</div>
          <div class="pay-opt ${selectedPayment==="Cartão"?"selected":""}" onclick="selectPay('Cartão',this)">💳 Cartão</div>
          <div class="pay-opt ${selectedPayment==="Dinheiro"?"selected":""}" onclick="selectPay('Dinheiro',this)">💵 Dinheiro</div>
        </div>
      </div>
      <button class="checkout-btn" onclick="openAddrModal()">📍 Confirmar endereço e finalizar</button>
    </div>`;
}

window.selectPay=(method,el)=>{
  selectedPayment=method;
  document.querySelectorAll(".pay-opt").forEach(o=>o.classList.remove("selected"));
  el.classList.add("selected");
};

window.openAddrModal=()=>{
  if(!selectedPayment){toast("Selecione a forma de pagamento","error");return;}
  const a=userProfile?.address;
  if(a){
    document.getElementById("addr-name").value=a.name||userProfile?.name||"";
    document.getElementById("addr-phone").value=a.phone||userProfile?.phone||"";
    document.getElementById("addr-street").value=a.street||"";
    document.getElementById("addr-num").value=a.num||"";
    document.getElementById("addr-neighborhood").value=a.neighborhood||"";
    document.getElementById("addr-comp").value=a.comp||"";
    document.getElementById("addr-ref").value=a.ref||"";
  } else {
    document.getElementById("addr-name").value=userProfile?.name||"";
    document.getElementById("addr-phone").value=userProfile?.phone||"";
  }
  document.getElementById("addr-modal").classList.add("show");
};
window.closeAddrModal=()=>document.getElementById("addr-modal").classList.remove("show");

window.confirmAddress=async()=>{
  const name=document.getElementById("addr-name").value.trim();
  const phone=document.getElementById("addr-phone").value.trim();
  const street=document.getElementById("addr-street").value.trim();
  const num=document.getElementById("addr-num").value.trim();
  const neighborhood=document.getElementById("addr-neighborhood").value.trim();
  if(!name||!phone||!street||!num||!neighborhood){toast("Preencha os campos obrigatórios (*)","error");return;}
  tempAddress={name,phone,street,num,neighborhood,
    comp:document.getElementById("addr-comp").value.trim(),
    ref:document.getElementById("addr-ref").value.trim()};
  if(document.getElementById("save-addr-check").checked){
    await updateDoc(doc(db,"users",currentUser.uid),{address:tempAddress});
    userProfile.address=tempAddress;
  }
  closeAddrModal();placeOrder();
};

async function placeOrder(){
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.qty),0);
  const total=subtotal+DELIVERY_FEE;
  try{
    await addDoc(collection(db,"orders"),{
      userId:currentUser.uid,userEmail:currentUser.email,userName:userProfile?.name||"",
      items:cart.map(i=>({id:i.id,name:i.name,emoji:i.emoji||"🎂",imageUrl:i.imageUrl||"",price:i.price,qty:i.qty,obs:i.obs||""})),
      subtotal,deliveryFee:DELIVERY_FEE,total,payment:selectedPayment,
      address:tempAddress,status:"novo",createdAt:serverTimestamp()
    });
    cart=[];selectedPayment="";tempAddress=null;
    updateCartBadge();
    await setDoc(doc(db,"carts",currentUser.uid),{items:[],updatedAt:serverTimestamp()});
    toast("Pedido realizado! 🎂","success",4000);navTo("orders");
  }catch(e){toast("Erro ao realizar pedido","error");}
}

let myOrders=[];
function listenOrders(){
  if(!currentUser)return;
  ordersUnsub=onSnapshot(query(collection(db,"orders"),where("userId","==",currentUser.uid),orderBy("createdAt","desc")),snap=>{
    myOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==="orders")navTo("orders");
  });
}

function renderOrders(){
  if(!myOrders.length) return `<div class="empty-state"><div class="empty-icon">📦</div><p>Você ainda não fez pedidos</p><button class="btn-go" onclick="navTo('home')">Fazer primeiro pedido</button></div>`;
  return `<div class="sec-title">📦 Meus Pedidos</div>`+myOrders.map(o=>{
    const ci=STATUS_STEPS.indexOf(o.status);
    const cancelled=o.status==="cancelado";
    const tl=cancelled?`<span class="badge badge-cancelado">❌ Pedido cancelado</span>`:
      `<div class="timeline">${STATUS_STEPS.map((s,i)=>{
        const done=i<ci,active=i===ci;
        return `<div class="tl-row"><div class="tl-left"><div class="tl-dot ${done?"done":active?"active":""}"></div>${i<STATUS_STEPS.length-1?`<div class="tl-line ${done?"done":""}"></div>`:""}</div>
          <div class="tl-text ${done?"done":active?"active":""}">${STATUS_LABELS[s]}</div></div>`;
      }).join("")}</div>`;
    const date=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("pt-BR"):"–";
    return `<div class="order-card">
      <div class="order-hdr"><div><div class="order-id">#${o.id.slice(-5).toUpperCase()}</div><div class="order-date">${date}</div></div></div>
      <div class="order-items-txt">${o.items.map(i=>`${i.qty}x ${i.name}${i.obs?` (${i.obs})`:""}`).join(" · ")}</div>
      ${tl}
      <div class="order-ftr">
        <div><div class="order-total-val">R$ ${o.total.toFixed(2).replace(".",",")}</div><div class="order-pay-txt">${o.payment}</div></div>
        <button class="repeat-btn" onclick="repeatOrder('${o.id}')">🔁 Pedir novamente</button>
      </div>
    </div>`;
  }).join("");
}

window.repeatOrder=id=>{
  const order=myOrders.find(o=>o.id===id);if(!order)return;
  order.items.forEach(i=>{const ex=cart.find(c=>c.id===i.id);if(ex)ex.qty+=i.qty;else cart.push({...i});});
  updateCartBadge();saveCartToFirestore();toast("Itens adicionados ao carrinho!","success");navTo("cart");
};

function renderProfile(){
  const a=userProfile?.address;
  return `<div class="sec-title">👤 Meu Perfil</div>
    <div class="profile-card">
      <div class="profile-avatar">${(userProfile?.name||"?")[0].toUpperCase()}</div>
      <div class="profile-name">${userProfile?.name||""}</div>
      <div class="profile-email">${currentUser?.email||""}</div>
      <div class="form-grid mt14">
        <div class="fgroup full"><label>NOME</label><input id="pf-name" value="${userProfile?.name||""}"/></div>
        <div class="fgroup full"><label>TELEFONE</label><input id="pf-phone" value="${userProfile?.phone||""}" oninput="maskPhone(this)"/></div>
      </div>
      <button class="btn-save" onclick="saveProfile()">💾 Salvar alterações</button>
    </div>
    ${a?`<div class="profile-card">
      <div class="sec-title" style="font-size:.95rem;margin-bottom:10px;">📍 Endereço salvo</div>
      <div class="addr-preview">${a.street}, ${a.num} – ${a.neighborhood}${a.comp?`<br>${a.comp}`:""}</div>
      <button class="btn-outline" onclick="openAddrModal()">✏️ Alterar endereço</button>
    </div>`:""}
    <button class="btn-logout" onclick="doLogout()">🚪 Sair da conta</button>`;
}

window.saveProfile=async()=>{
  const name=document.getElementById("pf-name").value.trim();
  const phone=document.getElementById("pf-phone").value.trim();
  if(!name){toast("Digite seu nome","error");return;}
  await updateDoc(doc(db,"users",currentUser.uid),{name,phone});
  userProfile.name=name;userProfile.phone=phone;toast("Perfil salvo!","success");
};
window.doLogout=async()=>{await signOut(auth);};

let adminOrders=[];
function setupAdminListeners(){
  if(adminUnsub)return;
  adminUnsub=onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")),snap=>{
    adminOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==="admin")navTo("admin");
  });
}

function renderAdmin(){
  if(userProfile?.role!=="admin") return `<div class="empty-state"><div class="empty-icon">🔒</div><p>Acesso restrito</p></div>`;
  return `<div class="sec-title">⚙️ Painel Admin</div>
    <div class="admin-tabs">
      <button class="admin-tab ${adminSubPage==="pedidos"?"active":""}" onclick="setAdminSub('pedidos')">📦 Pedidos</button>
      <button class="admin-tab ${adminSubPage==="cardapio"?"active":""}" onclick="setAdminSub('cardapio')">🎂 Cardápio</button>
    </div>
    ${adminSubPage==="pedidos"?renderAdminPedidos():renderAdminCardapio()}`;
}

window.setAdminSub=sub=>{adminSubPage=sub;navTo("admin");};

function renderAdminPedidos(){
  const today=new Date();today.setHours(0,0,0,0);
  const todayOrders=adminOrders.filter(o=>o.createdAt?.toDate&&o.createdAt.toDate()>=today&&o.status!=="cancelado");
  const revenue=todayOrders.reduce((s,o)=>s+o.total,0);
  const filtered=adminFilter==="todos"?adminOrders:adminOrders.filter(o=>o.status===adminFilter);
  const filters=["todos","novo","aceito","preparo","entrega","entregue","cancelado"];
  const fL={todos:"Todos",novo:"Novos",aceito:"Aceitos",preparo:"Em preparo",entrega:"A caminho",entregue:"Entregues",cancelado:"Cancelados"};
  return `<div class="dashboard">
    <div class="dash-card"><div class="dash-val">${todayOrders.length}</div><div class="dash-label">Pedidos hoje</div></div>
    <div class="dash-card"><div class="dash-val">R$${revenue.toFixed(0)}</div><div class="dash-label">Faturamento hoje</div></div>
    <div class="dash-card"><div class="dash-val">${adminOrders.filter(o=>o.status==="novo").length}</div><div class="dash-label">Aguardando</div></div>
  </div>
  <div class="filter-row">${filters.map(f=>`<button class="filter-btn ${adminFilter===f?"active":""}" onclick="setAdminFilter('${f}')">${fL[f]}</button>`).join("")}</div>
  ${filtered.length===0?`<div class="empty-state"><div class="empty-icon">📭</div><p>Nenhum pedido</p></div>`:
  filtered.map(o=>{
    const date=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("pt-BR"):"–";
    const a=o.address;
    return `<div class="admin-order">
      <div class="admin-order-hdr"><span class="admin-order-id">#${o.id.slice(-5).toUpperCase()}</span><span class="badge badge-${o.status}">${STATUS_LABELS[o.status]||o.status}</span></div>
      <div class="admin-meta">👤 ${o.userName||o.userEmail} · 📱 ${a?.phone||"–"}</div>
      <div class="admin-meta">📍 ${a?`${a.street}, ${a.num} – ${a.neighborhood}${a.comp?` (${a.comp})`:""}`:"–"}</div>
      <div class="admin-items-txt">${o.items.map(i=>`${i.qty}x ${i.name}${i.obs?` (${i.obs})`:""}`).join(" · ")}</div>
      <div style="color:var(--sub);font-size:.78rem;margin-bottom:8px;">${date} · ${o.payment}</div>
      <div class="admin-ftr">
        <span class="admin-total">R$ ${o.total.toFixed(2).replace(".",",")}</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="cancel-btn" onclick="cancelOrder('${o.id}')">❌</button>
          <select class="status-select" onchange="changeStatus('${o.id}',this.value)">
            ${["novo","aceito","preparo","entrega","entregue","cancelado"].map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${STATUS_LABELS[s]}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>`;
  }).join("")}`;
}

function renderAdminCardapio(){
  return `<button class="add-prod-btn" onclick="openProductModal()">➕ Adicionar novo produto</button>
    ${ALL_CATS.map(cat=>{
      const items=menuItems.filter(i=>i.category===cat);
      return `<div class="sec-title">${CAT_LABELS[cat]}</div>
        <div class="product-grid">
          ${items.length?items.map(item=>{
            const img=item.imageUrl?`<img class="prod-img" src="${item.imageUrl}"/>`:`<div class="prod-emoji-bg">${item.emoji||"🎂"}</div>`;
            return `<div class="prod-card">${img}<div class="prod-body">
              <div class="prod-name">${item.name}</div>
              <div class="prod-price">R$ ${Number(item.price).toFixed(2).replace(".",",")}</div>
              <div class="prod-actions">
                <button class="edit-btn" onclick="openProductModal('${item.id}')">✏️ Editar</button>
                <button class="del-btn" onclick="deleteProduct('${item.id}')">🗑️</button>
              </div>
            </div></div>`;
          }).join(""):`<p style="color:var(--sub);font-size:.85rem;padding:4px 0;">Nenhum produto</p>`}
        </div>`;
    }).join("")}`;
}

window.setAdminFilter=f=>{adminFilter=f;navTo("admin");};
window.changeStatus=async(id,status)=>{
  try{await updateDoc(doc(db,"orders",id),{status});toast("Atualizado!","success",1500);}
  catch(e){toast("Erro","error");}
};
window.cancelOrder=async id=>{
  try{await updateDoc(doc(db,"orders",id),{status:"cancelado"});toast("Pedido cancelado","info");}
  catch(e){toast("Erro","error");}
};

window.openProductModal=id=>{
  editingProductId=id||null;productImgFile=null;
  const preview=document.getElementById("prod-img-preview");
  const label=document.getElementById("img-upload-label");
  document.getElementById("product-modal-title").textContent=id?"✏️ Editar Produto":"➕ Novo Produto";
  if(id){
    const item=menuItems.find(i=>i.id===id);if(!item)return;
    document.getElementById("prod-name").value=item.name||"";
    document.getElementById("prod-desc").value=item.desc||"";
    document.getElementById("prod-price").value=item.price||"";
    document.getElementById("prod-category").value=item.category||"bolos";
    document.getElementById("prod-emoji").value=item.emoji||"";
    if(item.imageUrl){preview.src=item.imageUrl;preview.style.display="block";label.style.display="none";}
    else{preview.style.display="none";label.style.display="flex";}
  } else {
    ["prod-name","prod-desc","prod-price","prod-emoji"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("prod-category").value="bolos";
    preview.style.display="none";label.style.display="flex";
  }
  document.getElementById("product-modal").classList.add("show");
};
window.closeProductModal=()=>{document.getElementById("product-modal").classList.remove("show");editingProductId=null;productImgFile=null;};

window.handleProductImg=e=>{
  const file=e.target.files[0];if(!file)return;
  if(file.size>5*1024*1024){toast("Imagem muito grande (máx 5MB)","error");return;}
  productImgFile=file;
  const reader=new FileReader();
  reader.onload=ev=>{
    const preview=document.getElementById("prod-img-preview");
    preview.src=ev.target.result;preview.style.display="block";
    document.getElementById("img-upload-label").style.display="none";
  };
  reader.readAsDataURL(file);
};

window.saveProduct=async()=>{
  const name=document.getElementById("prod-name").value.trim();
  const desc=document.getElementById("prod-desc").value.trim();
  const price=parseFloat(document.getElementById("prod-price").value);
  const category=document.getElementById("prod-category").value;
  const emoji=document.getElementById("prod-emoji").value.trim()||"🎂";
  if(!name||isNaN(price)||price<=0||!category){toast("Preencha nome, preço e categoria","error");return;}
  const btn=document.getElementById("save-product-btn");
  btn.disabled=true;btn.innerHTML='<span class="spinner-g"></span> Salvando...';
  try{
    let imageUrl=editingProductId?menuItems.find(i=>i.id===editingProductId)?.imageUrl||"":"";
    if(productImgFile){
      try{
        const imgRef=ref(storage,`products/${Date.now()}_${productImgFile.name}`);
        await uploadBytes(imgRef,productImgFile);
        imageUrl=await getDownloadURL(imgRef);
      }catch(uploadErr){
        console.warn("Upload de imagem falhou, salvando sem imagem:",uploadErr);
        toast("Foto não pôde ser salva, mas o produto será salvo sem imagem.","info",4000);
      }
    }
    const data={name,desc:desc||"",price:Number(price),category,emoji,imageUrl:imageUrl||"",updatedAt:serverTimestamp()};
    if(editingProductId){
      await updateDoc(doc(db,"products",editingProductId),data);
      toast("Produto atualizado! ✅","success");
    } else {
      await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
      toast("Produto adicionado! ✅","success");
    }
    closeProductModal();
  }catch(e){
    console.error("Erro ao salvar produto:",e);
    toast(`Erro: ${e.message||"Tente novamente"})`,"error",5000);
  }finally{
    btn.disabled=false;btn.textContent="💾 Salvar produto";
  }
};

window.deleteProduct=async id=>{
  if(!confirm("Remover este produto?"))return;
  try{await deleteDoc(doc(db,"products",id));toast("Produto removido","info");}
  catch(e){toast("Erro ao remover","error");}
};
</script>
</body>
